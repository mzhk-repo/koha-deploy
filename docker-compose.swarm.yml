services:
  koha:
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    depends_on: !reset null
    entrypoint:
      - /bin/sh
      - -ec
      - |
        while IFS= read -r line || [ -n "$$line" ]; do
          case "$$line" in
            ""|\#*) continue ;;
          esac
          export "$$line"
        done < /run/secrets/app_env_payload
        if [ -z "$${MYSQL_PASSWORD:-}" ] && [ -n "$${DB_PASS:-}" ]; then
          export MYSQL_PASSWORD="$${DB_PASS}"
        fi
        if [ -z "$${MB_PASS:-}" ] && [ -n "$${RABBITMQ_PASS:-}" ]; then
          export MB_PASS="$${RABBITMQ_PASS}"
        fi
        exec "$$@"
      - --
    env_file: !reset []
    environment: !override
      MYSQL_SERVER: ${DB_HOST:-db}
      MYSQL_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_DOMAIN: ${KOHA_DOMAIN}
      KOHA_CONF: /etc/koha/sites/${KOHA_INSTANCE}/koha-conf.xml
      KOHA_OPAC_PORT: ${KOHA_OPAC_PORT}
      KOHA_INTRANET_PORT: ${KOHA_INTRANET_PORT}
      KOHA_OPAC_PREFIX: ${KOHA_OPAC_PREFIX:-}
      KOHA_OPAC_SUFFIX: ${KOHA_OPAC_SUFFIX:-}
      KOHA_INTRANET_PREFIX: ${KOHA_INTRANET_PREFIX:-}
      KOHA_INTRANET_SUFFIX: ${KOHA_INTRANET_SUFFIX:--intra}
      KOHA_OPAC_SERVERNAME: ${KOHA_OPAC_SERVERNAME:-}
      KOHA_INTRANET_SERVERNAME: ${KOHA_INTRANET_SERVERNAME:-}
      TZ: ${KOHA_TIMEZONE}
      KOHA_LANGS: ${KOHA_LANGS:-}
      MB_HOST: ${MB_HOST:-rabbitmq}
      MB_PORT: ${MB_PORT:-61613}
      MB_USER: ${RABBITMQ_USER}
      USE_ELASTICSEARCH: ${USE_ELASTICSEARCH:-true}
      KOHA_ES_INDEXER_AUTOSTART: ${KOHA_ES_INDEXER_AUTOSTART:-false}
      KOHA_BACKGROUND_WORKERS_AUTOSTART: ${KOHA_BACKGROUND_WORKERS_AUTOSTART:-false}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-es:9200}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS:-memcached:11211}
      KOHA_SETUP_FAIL_FAST: ${KOHA_SETUP_FAIL_FAST:-false}
      KOHA_SETUP_REQUIRED_STEPS: ${KOHA_SETUP_REQUIRED_STEPS:-00-env-checks.sh}
      KOHA_SETUP_SKIP_STEPS: ${KOHA_SETUP_SKIP_STEPS:-}
      KOHA_SETUP_ONLY_STEPS: ${KOHA_SETUP_ONLY_STEPS:-}
    secrets:
      - source: app_env_payload
        target: app_env_payload
    healthcheck:
      start_period: 360s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        failure_action: rollback
        monitor: 120s
        order: start-first
      rollback_config:
        parallelism: 1
        failure_action: pause
        monitor: 120s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager

  koha-worker-default: &koha_background_worker_swarm
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    depends_on: !reset null
    env_file: !reset []
    environment: !override
      MYSQL_SERVER: ${DB_HOST:-db}
      MYSQL_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_INSTANCE_UID: ${KOHA_INSTANCE_UID:-1000}
      KOHA_INSTANCE_GID: ${KOHA_INSTANCE_GID:-1000}
      KOHA_CONF: /etc/koha/sites/${KOHA_INSTANCE}/koha-conf.xml
      TZ: ${KOHA_TIMEZONE}
      MB_HOST: ${MB_HOST:-rabbitmq}
      MB_PORT: ${MB_PORT:-61613}
      MB_USER: ${RABBITMQ_USER}
      KOHA_WORKER_WAIT_TIMEOUT: ${KOHA_WORKER_WAIT_TIMEOUT:-300}
      KOHA_WORKER_MONITOR_INTERVAL: ${KOHA_WORKER_MONITOR_INTERVAL:-30}
      KOHA_WORKER_CONSUMER_GRACE_SECONDS: ${KOHA_WORKER_CONSUMER_GRACE_SECONDS:-90}
      KOHA_WORKER_STALE_CONSUMER_CLEANUP: ${KOHA_WORKER_STALE_CONSUMER_CLEANUP:-true}
      KOHA_WORKER_DRAIN_TIMEOUT: ${KOHA_WORKER_DEFAULT_DRAIN_TIMEOUT:-300}
      KOHA_WORKER_QUEUE: default
      MAX_PROCESSES: ${KOHA_WORKER_DEFAULT_MAX_PROCESSES:-1}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${KOHA_WORKER_DEFAULT_CPUS:-0.25}"
          memory: ${KOHA_WORKER_DEFAULT_MEM_LIMIT:-512m}
          pids: 256
      update_config:
        parallelism: 1
        failure_action: pause
        monitor: 120s
        order: stop-first
      rollback_config:
        parallelism: 1
        failure_action: pause
        monitor: 120s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      placement:
        constraints:
          - node.labels.app_zone == manager

  koha-worker-long-tasks:
    <<: *koha_background_worker_swarm
    environment: !override
      MYSQL_SERVER: ${DB_HOST:-db}
      MYSQL_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_INSTANCE_UID: ${KOHA_INSTANCE_UID:-1000}
      KOHA_INSTANCE_GID: ${KOHA_INSTANCE_GID:-1000}
      KOHA_CONF: /etc/koha/sites/${KOHA_INSTANCE}/koha-conf.xml
      TZ: ${KOHA_TIMEZONE}
      MB_HOST: ${MB_HOST:-rabbitmq}
      MB_PORT: ${MB_PORT:-61613}
      MB_USER: ${RABBITMQ_USER}
      KOHA_WORKER_WAIT_TIMEOUT: ${KOHA_WORKER_WAIT_TIMEOUT:-300}
      KOHA_WORKER_MONITOR_INTERVAL: ${KOHA_WORKER_MONITOR_INTERVAL:-30}
      KOHA_WORKER_CONSUMER_GRACE_SECONDS: ${KOHA_WORKER_CONSUMER_GRACE_SECONDS:-90}
      KOHA_WORKER_STALE_CONSUMER_CLEANUP: ${KOHA_WORKER_STALE_CONSUMER_CLEANUP:-true}
      KOHA_WORKER_DRAIN_TIMEOUT: ${KOHA_WORKER_LONG_TASKS_DRAIN_TIMEOUT:-1800}
      KOHA_WORKER_QUEUE: long_tasks
      MAX_PROCESSES: ${KOHA_WORKER_LONG_TASKS_MAX_PROCESSES:-1}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${KOHA_WORKER_LONG_TASKS_CPUS:-0.50}"
          memory: ${KOHA_WORKER_LONG_TASKS_MEM_LIMIT:-1g}
          pids: 256
      update_config:
        parallelism: 1
        failure_action: pause
        monitor: 120s
        order: stop-first
      rollback_config:
        parallelism: 1
        failure_action: pause
        monitor: 120s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      placement:
        constraints:
          - node.labels.app_zone == manager

  db:
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    environment: !override
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      TZ: ${KOHA_TIMEZONE}
    secrets:
      - source: db_password
        target: db_password
      - source: db_root_password
        target: db_root_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb --protocol=tcp -h 127.0.0.1 -uroot --password=\"$$(cat /run/secrets/db_root_password)\" -e 'SELECT 1' >/dev/null || exit 1"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager

  koha-es-indexer:
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    depends_on: !reset null
    env_file: !reset []
    environment: !override
      MYSQL_SERVER: ${DB_HOST:-db}
      MYSQL_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_INSTANCE_UID: ${KOHA_INSTANCE_UID:-1000}
      KOHA_INSTANCE_GID: ${KOHA_INSTANCE_GID:-1000}
      KOHA_CONF: /etc/koha/sites/${KOHA_INSTANCE}/koha-conf.xml
      TZ: ${KOHA_TIMEZONE}
      MB_HOST: ${MB_HOST:-rabbitmq}
      MB_PORT: ${MB_PORT:-61613}
      MB_USER: ${RABBITMQ_USER}
      USE_ELASTICSEARCH: ${USE_ELASTICSEARCH:-true}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-es:9200}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS:-memcached:11211}
      KOHA_ES_INDEXER_BATCH_SIZE: ${KOHA_ES_INDEXER_BATCH_SIZE:-10}
      KOHA_ES_INDEXER_WAIT_TIMEOUT: ${KOHA_ES_INDEXER_WAIT_TIMEOUT:-300}
      KOHA_ES_INDEXER_MONITOR_INTERVAL: ${KOHA_ES_INDEXER_MONITOR_INTERVAL:-30}
      KOHA_ES_INDEXER_CONSUMER_GRACE_SECONDS: ${KOHA_ES_INDEXER_CONSUMER_GRACE_SECONDS:-90}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${KOHA_ES_INDEXER_CPUS:-0.50}"
          memory: ${KOHA_ES_INDEXER_MEM_LIMIT:-512m}
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      placement:
        constraints:
          - node.labels.app_zone == manager

  rabbitmq:
    build: !reset null
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    image: docker.io/rabbitmq:${RABBITMQ_VERSION:-3-management}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export RABBITMQ_DEFAULT_PASS="$(cat /run/secrets/rabbitmq_password)"
        exec docker-entrypoint.sh rabbitmq-server
      - --
    env_file: !reset []
    environment: !override
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    secrets:
      - source: rabbitmq_password
        target: rabbitmq_password
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager

  es:
    build: !reset null
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager

  memcached:
    build: !reset null
    cpus: !reset null
    mem_limit: !reset null
    pids_limit: !reset null
    restart: !reset null
    image: docker.io/memcached:${MEMCACHED_VERSION:-1.6}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager

networks:
  kohanet:
    driver: overlay

secrets:
  app_env_payload:
    external: true
    name: ${KOHA_APP_ENV_PAYLOAD_SECRET_NAME}
  db_password:
    external: true
    name: ${KOHA_DB_PASSWORD_SECRET_NAME}
  db_root_password:
    external: true
    name: ${KOHA_DB_ROOT_PASSWORD_SECRET_NAME}
  rabbitmq_password:
    external: true
    name: ${RABBITMQ_PASSWORD_SECRET_NAME}

configs:
  rabbitmq_enabled_plugins:
    file: ./rabbitmq/enabled_plugins
  koha_worker_autostart_guard: !override
    external: true
    name: ${KOHA_WORKER_AUTOSTART_GUARD_CONFIG_NAME}
  koha_background_worker_supervisor: !override
    external: true
    name: ${KOHA_BACKGROUND_WORKER_SUPERVISOR_CONFIG_NAME}
