services:
  koha:
    image: ${KOHA_IMAGE}
    command:
      - /bin/sh
      - -lc
      - a2enmod remoteip headers >/dev/null 2>&1 || true; exec /init
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${KOHA_MEM_LIMIT:-2g}
    cpus: ${KOHA_CPUS:-1.50}
    # Host-published ports are intentionally disabled in production.
    # External access must go through edge gateway/proxy (Traefik + external tunnel).
    # ports:
    #   - "${KOHA_OPAC_PORT:-8080}:${KOHA_OPAC_PORT:-8080}"
    #   - "${KOHA_INTRANET_PORT:-8081}:${KOHA_INTRANET_PORT:-8081}"
    networks:
      - kohanet
      - proxy-net
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${EXTERNAL_NETWORK}"

        - "traefik.http.routers.koha-opac.rule=Host(`${KOHA_OPAC_SERVERNAME}`)"
        - "traefik.http.routers.koha-opac.entrypoints=web"
        - "traefik.http.routers.koha-opac.service=koha-opac"
        - "traefik.http.services.koha-opac.loadbalancer.server.port=${KOHA_OPAC_PORT:-8080}"

        - "traefik.http.routers.koha-staff.rule=Host(`${KOHA_INTRANET_SERVERNAME}`)"
        - "traefik.http.routers.koha-staff.entrypoints=web"
        - "traefik.http.routers.koha-staff.service=koha-staff"
        - "traefik.http.services.koha-staff.loadbalancer.server.port=${KOHA_INTRANET_PORT:-8081}"
    cap_add:
      - DAC_READ_SEARCH
      - SYS_NICE
    environment:
      MYSQL_SERVER: ${DB_HOST:-db}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_ROOT_PASS: ${DB_ROOT_PASS}

      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_DOMAIN: ${KOHA_DOMAIN}
      KOHA_CONF: /etc/koha/sites/${KOHA_INSTANCE}/koha-conf.xml
      KOHA_OPAC_PORT: ${KOHA_OPAC_PORT}
      KOHA_INTRANET_PORT: ${KOHA_INTRANET_PORT}
      KOHA_OPAC_PREFIX: ${KOHA_OPAC_PREFIX:-}
      KOHA_OPAC_SUFFIX: ${KOHA_OPAC_SUFFIX:-}
      KOHA_INTRANET_PREFIX: ${KOHA_INTRANET_PREFIX:-}
      KOHA_INTRANET_SUFFIX: ${KOHA_INTRANET_SUFFIX:--intra}
      KOHA_OPAC_SERVERNAME: ${KOHA_OPAC_SERVERNAME:-}
      KOHA_INTRANET_SERVERNAME: ${KOHA_INTRANET_SERVERNAME:-}
      TZ: ${KOHA_TIMEZONE}
      KOHA_LANGS: ${KOHA_LANGS:-}

      MB_HOST: ${MB_HOST:-rabbitmq}
      MB_PORT: ${MB_PORT:-61613}
      MB_USER: ${RABBITMQ_USER}
      MB_PASS: ${RABBITMQ_PASS}

      USE_ELASTICSEARCH: ${USE_ELASTICSEARCH:-true}
      KOHA_ES_INDEXER_AUTOSTART: ${KOHA_ES_INDEXER_AUTOSTART:-false}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-es:9200}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS:-memcached:11211}

      KOHA_SETUP_FAIL_FAST: ${KOHA_SETUP_FAIL_FAST:-false}
      KOHA_SETUP_REQUIRED_STEPS: ${KOHA_SETUP_REQUIRED_STEPS:-00-env-checks.sh}
      KOHA_SETUP_SKIP_STEPS: ${KOHA_SETUP_SKIP_STEPS:-}
      KOHA_SETUP_ONLY_STEPS: ${KOHA_SETUP_ONLY_STEPS:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_started
      es:
        condition: service_healthy
    volumes:
      - ./apache/remoteip.conf:/etc/apache2/conf-enabled/zz-koha-remoteip.conf:ro
      - ./apache/csp-report-only.conf:/etc/apache2/conf-enabled/zz-koha-csp-report-only.conf:ro
      - ${VOL_KOHA_CONF}:/etc/koha/sites
      - ${VOL_KOHA_CONF}/${KOHA_INSTANCE}:/etc/koha/sites/default
      - ${VOL_KOHA_DATA}:/var/lib/koha
      - ${VOL_KOHA_LOGS}:/var/log/koha
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          wget -q --spider "http://localhost:$${KOHA_INTRANET_PORT:-8081}" || exit 1

          export KOHA_HOME="/usr/share/koha"
          export PERL5LIB="/usr/share/koha/lib"

          koha_user="$${KOHA_INSTANCE}-koha"
          jobs_method="$$(runuser --preserve-environment -u "$$koha_user" -- \
            perl -I/usr/share/koha/lib -MC4::Context -e 'print C4::Context->preference(q(JobsNotificationMethod)) // q(STOMP);' 2>/dev/null || printf 'STOMP')"
          if [ "$$jobs_method" != "STOMP" ]; then
            exit 0
          fi

          runuser --preserve-environment -u "$$koha_user" -- \
            perl -I/usr/share/koha/lib -MHTTP::Tiny -MXML::LibXML -MMIME::Base64=encode_base64 -MC4::Context -e '
              sub xml_value {
                my ($$doc, $$name) = @_;
                my ($$node) = $$doc->findnodes("//message_broker/$$name");
                return $$node ? $$node->textContent : "";
              }
              sub url_escape {
                my ($$value) = @_;
                $$value =~ s/([^A-Za-z0-9_.~-])/sprintf("%%%02X", ord($$1))/eg;
                return $$value;
              }

              my $$doc = XML::LibXML->load_xml(location => $$ENV{KOHA_CONF});
              my $$host = xml_value($$doc, "hostname") || $$ENV{MB_HOST} || "rabbitmq";
              my $$user = xml_value($$doc, "username") || $$ENV{MB_USER} || "";
              my $$pass = xml_value($$doc, "password") || $$ENV{MB_PASS} || "";
              my $$vhost = xml_value($$doc, "vhost") || "/";
              my $$namespace = C4::Context->config("memcached_namespace") || "koha_" . ($$ENV{KOHA_INSTANCE} || "library");
              my $$auth = encode_base64("$$user:$$pass", "");
              my $$http = HTTP::Tiny->new(timeout => 5);

              for my $$suffix (qw(default long_tasks)) {
                my $$queue = $$namespace . "-" . $$suffix;
                my $$url = "http://$$host:15672/api/queues/" . url_escape($$vhost) . "/" . url_escape($$queue);
                my $$response = $$http->get($$url, { headers => { Authorization => "Basic $$auth" } });
                die "RabbitMQ Management API check failed for $$queue\n" unless $$response->{success};
                my ($$consumers) = $$response->{content} =~ /"consumers"\s*:\s*(\d+)/;
                $$consumers ||= 0;
                die "RabbitMQ queue $$queue has no consumers\n" if $$consumers < 1;
              }
            '
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  koha-es-indexer:
    image: ${KOHA_IMAGE}
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        if [ "$$USE_ELASTICSEARCH" != "true" ]; then
          echo "Elasticsearch disabled; keeping koha-es-indexer idle"
          exec sleep infinity
        fi

        export KOHA_HOME="/usr/share/koha"
        export PERL5LIB="/usr/share/koha/lib"

        if ! getent group "$$KOHA_INSTANCE-koha" >/dev/null; then
          groupadd --gid "$$KOHA_INSTANCE_GID" "$$KOHA_INSTANCE-koha"
        fi
        if ! getent passwd "$$KOHA_INSTANCE-koha" >/dev/null; then
          useradd --uid "$$KOHA_INSTANCE_UID" --gid "$$KOHA_INSTANCE_GID" \
            --home-dir "/home/$$KOHA_INSTANCE-koha" --create-home --shell /bin/bash \
            "$$KOHA_INSTANCE-koha"
        fi

        deadline=$$((SECONDS + KOHA_ES_INDEXER_WAIT_TIMEOUT))
        wait_until() {
          local label="$$1"
          shift
          until "$$@"; do
            if [ "$$SECONDS" -ge "$$deadline" ]; then
              echo "ERROR: timeout waiting for $$label" >&2
              exit 1
            fi
            sleep 3
          done
        }

        wait_until "koha-conf.xml" test -r "$$KOHA_CONF"
        wait_until "Koha database" koha-mysql "$$KOHA_INSTANCE" -N -B -e "SELECT 1"

        tcp_probe() {
          local endpoint="$$1"
          local default_port="$$2"
          local host port

          endpoint="$${endpoint#http://}"
          endpoint="$${endpoint#https://}"
          endpoint="$${endpoint%%/*}"
          host="$${endpoint%%:*}"
          port="$${endpoint##*:}"
          if [ "$$port" = "$$endpoint" ]; then
            port="$$default_port"
          fi

          timeout 3 bash -c "</dev/tcp/$$host/$$port"
        }

        wait_until "Elasticsearch TCP" tcp_probe "$$ELASTICSEARCH_HOST" 9200

        jobs_notification_method() {
          runuser --preserve-environment -u "$$KOHA_INSTANCE-koha" -- \
            perl -I/usr/share/koha/lib -MC4::Context -e "print C4::Context->preference(q(JobsNotificationMethod)) // q(STOMP);"
        }

        if [ "$$(jobs_notification_method)" = "STOMP" ]; then
          wait_until "RabbitMQ STOMP TCP" tcp_probe "$$MB_HOST:$${MB_PORT:-61613}" 61613
          wait_until "RabbitMQ STOMP Koha connect" runuser --preserve-environment -u "$$KOHA_INSTANCE-koha" -- \
            perl -I/usr/share/koha/lib -MKoha::BackgroundJob -e 'my $$conn=Koha::BackgroundJob->connect; exit 1 unless $$conn; $$conn->disconnect; exit 0'
        fi

        rabbitmq_elastic_consumers() {
          runuser --preserve-environment -u "$$KOHA_INSTANCE-koha" -- \
            perl -I/usr/share/koha/lib -MHTTP::Tiny -MXML::LibXML -MMIME::Base64=encode_base64 -MC4::Context -e '
              sub xml_value {
                my ($$doc, $$name) = @_;
                my ($$node) = $$doc->findnodes("//message_broker/$$name");
                return $$node ? $$node->textContent : "";
              }
              sub url_escape {
                my ($$value) = @_;
                $$value =~ s/([^A-Za-z0-9_.~-])/sprintf("%%%02X", ord($$1))/eg;
                return $$value;
              }

              my $$doc = XML::LibXML->load_xml(location => $$ENV{KOHA_CONF});
              my $$host = xml_value($$doc, "hostname") || $$ENV{MB_HOST} || "rabbitmq";
              my $$user = xml_value($$doc, "username") || $$ENV{MB_USER} || "";
              my $$pass = xml_value($$doc, "password") || "";
              my $$vhost = xml_value($$doc, "vhost") || "/";
              my $$namespace = C4::Context->config("memcached_namespace") || "koha_" . ($$ENV{KOHA_INSTANCE} || "library");
              my $$queue = $$namespace . "-elastic_index";
              my $$auth = encode_base64("$$user:$$pass", "");
              my $$url = "http://$$host:15672/api/queues/" . url_escape($$vhost) . "/" . url_escape($$queue);
              my $$response = HTTP::Tiny->new(timeout => 5)->get($$url, { headers => { Authorization => "Basic $$auth" } });
              exit 2 unless $$response->{success};
              my ($$consumers) = $$response->{content} =~ /"consumers"\s*:\s*(\d+)/;
              print defined($$consumers) ? $$consumers : 0;
            '
        }

        monitor_interval="$${KOHA_ES_INDEXER_MONITOR_INTERVAL:-30}"
        consumer_grace="$${KOHA_ES_INDEXER_CONSUMER_GRACE_SECONDS:-90}"
        if ! [[ "$$monitor_interval" =~ ^[0-9]+$$ ]] || [ "$$monitor_interval" -lt 1 ]; then
          echo "ERROR: KOHA_ES_INDEXER_MONITOR_INTERVAL must be a positive integer" >&2
          exit 1
        fi
        if ! [[ "$$consumer_grace" =~ ^[0-9]+$$ ]] || [ "$$consumer_grace" -lt "$$monitor_interval" ]; then
          echo "ERROR: KOHA_ES_INDEXER_CONSUMER_GRACE_SECONDS must be >= KOHA_ES_INDEXER_MONITOR_INTERVAL" >&2
          exit 1
        fi

        runuser --preserve-environment -u "$$KOHA_INSTANCE-koha" -- \
          /usr/bin/perl /usr/share/koha/bin/workers/es_indexer_daemon.pl \
          --batch_size "$$KOHA_ES_INDEXER_BATCH_SIZE" &
        indexer_pid="$$!"

        stop_indexer() {
          if kill -0 "$$indexer_pid" 2>/dev/null; then
            kill "$$indexer_pid" 2>/dev/null || true
            wait "$$indexer_pid" 2>/dev/null || true
          fi
        }
        trap 'stop_indexer; exit 143' TERM INT

        if [ "$$(jobs_notification_method)" != "STOMP" ]; then
          wait "$$indexer_pid"
          exit "$$?"
        fi

        consumer_missing_since=""
        while kill -0 "$$indexer_pid" 2>/dev/null; do
          consumers="$$(rabbitmq_elastic_consumers || printf '0')"
          if [ "$$consumers" -gt 0 ]; then
            consumer_missing_since=""
          else
            if [ -z "$$consumer_missing_since" ]; then
              consumer_missing_since="$$SECONDS"
              echo "WARNING: koha-es-indexer RabbitMQ consumer missing (consumers=$$consumers)"
            elif [ "$$((SECONDS - consumer_missing_since))" -ge "$$consumer_grace" ]; then
              echo "ERROR: koha-es-indexer RabbitMQ consumer missing for >=$${consumer_grace}s; exiting for Swarm restart" >&2
              stop_indexer
              exit 1
            fi
          fi
          sleep "$$monitor_interval"
        done

        wait "$$indexer_pid"
        exit "$$?"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${KOHA_ES_INDEXER_MEM_LIMIT:-512m}
    cpus: ${KOHA_ES_INDEXER_CPUS:-0.50}
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          if [ "$${USE_ELASTICSEARCH:-true}" != "true" ]; then exit 0; fi
          _p=$$(printf '%04X' "$${MB_PORT:-61613}")
          grep -qiE "[0-9A-F]+:$${_p} 01 " /proc/net/tcp /proc/net/tcp6 2>/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 360s
    networks:
      - kohanet
    environment:
      MYSQL_SERVER: ${DB_HOST:-db}
      MYSQL_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_INSTANCE_UID: ${KOHA_INSTANCE_UID:-1000}
      KOHA_INSTANCE_GID: ${KOHA_INSTANCE_GID:-1000}
      KOHA_CONF: /etc/koha/sites/${KOHA_INSTANCE}/koha-conf.xml
      TZ: ${KOHA_TIMEZONE}
      MB_HOST: ${MB_HOST:-rabbitmq}
      MB_PORT: ${MB_PORT:-61613}
      MB_USER: ${RABBITMQ_USER}
      USE_ELASTICSEARCH: ${USE_ELASTICSEARCH:-true}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-es:9200}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS:-memcached:11211}
      KOHA_ES_INDEXER_BATCH_SIZE: ${KOHA_ES_INDEXER_BATCH_SIZE:-10}
      KOHA_ES_INDEXER_WAIT_TIMEOUT: ${KOHA_ES_INDEXER_WAIT_TIMEOUT:-300}
      KOHA_ES_INDEXER_MONITOR_INTERVAL: ${KOHA_ES_INDEXER_MONITOR_INTERVAL:-30}
      KOHA_ES_INDEXER_CONSUMER_GRACE_SECONDS: ${KOHA_ES_INDEXER_CONSUMER_GRACE_SECONDS:-90}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      es:
        condition: service_healthy
    volumes:
      - ${VOL_KOHA_CONF}:/etc/koha/sites
      - ${VOL_KOHA_CONF}/${KOHA_INSTANCE}:/etc/koha/sites/default
      - ${VOL_KOHA_DATA}:/var/lib/koha
      - ${VOL_KOHA_LOGS}:/var/log/koha

  db:
    image: ${MARIADB_IMAGE:-docker.io/mariadb:11}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=${DB_SERVER_ID:-1}
      - --log-bin=${DB_LOG_BIN_BASENAME:-mysql-bin}
      - --binlog-format=${DB_BINLOG_FORMAT:-ROW}
      - --binlog-row-image=${DB_BINLOG_ROW_IMAGE:-FULL}
      - --sync-binlog=${DB_SYNC_BINLOG:-1}
      - --expire-logs-days=${DB_BINLOG_EXPIRE_DAYS:-7}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-1.50}
    networks:
      - kohanet
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      TZ: ${KOHA_TIMEZONE}
    volumes:
      - ${VOL_DB_PATH}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
      args:
        RABBITMQ_VERSION: ${RABBITMQ_VERSION:-3-management}
    image: ${RABBITMQ_IMAGE:-koha-local-rabbitmq:3-management}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    cpus: ${RABBITMQ_CPUS:-1.00}
    networks:
      - kohanet
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  es:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
      args:
        ES_VERSION: ${ES_VERSION:-8.19.6}
    image: ${ES_IMAGE:-koha-local-es:8.19.6}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${ES_MEM_LIMIT:-1g}
    cpus: ${ES_CPUS:-1.00}
    cap_drop:
      - ALL
    networks:
      - kohanet
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${KOHA_TIMEZONE}
    volumes:
      - ${VOL_ES_PATH}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  memcached:
    build:
      context: ./memcached
      dockerfile: Dockerfile
      args:
        MEMCACHED_VERSION: ${MEMCACHED_VERSION:-1.6}
    image: ${MEMCACHED_IMAGE:-koha-local-memcached:1.6}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${MEMCACHED_MEM_LIMIT:-256m}
    cpus: ${MEMCACHED_CPUS:-0.50}
    cap_drop:
      - ALL
    networks:
      - kohanet

networks:
  kohanet:
    driver: bridge
    name: ${KOHA_NETWORK}
  proxy-net:
    external: true
    name: ${EXTERNAL_NETWORK}
